bundle:
  name: supply_chain_capstone

include:
  - resources/*.yml

variables:
  pipeline_schema:
    description: Schema the declarative pipeline writes its tables to
    default: sdp_demo_bundle

targets:
  dev:
    mode: development
    default: true

  ci:
    mode: development
    presets:
      name_prefix: "ci_info_jude_antony_"
    variables:
      pipeline_schema: sdp_demo_ci